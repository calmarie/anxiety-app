services:
  db:
    image: postgres:16-alpine
    container_name: anxiety-postgres
    environment:
      POSTGRES_DB: anxiety_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_users.sql:/docker-entrypoint-initdb.d/001_create_users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anxiety_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anxiety-backend
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"

volumes:
  postgres_data:
